name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU torch and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[xgboost,dev]"
      - name: Tests with coverage
        run: pytest --cov=iiot_qelm --cov-report=term-missing
      - name: Paper audit (no data)
        run: iiot-qelm audit --out "$RUNNER_TEMP/audit.md"
      - name: Offline CPU demo
        run: iiot-qelm demo --out "$RUNNER_TEMP/demo" --rows 900 --epochs 3
